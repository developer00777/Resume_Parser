services:
  # ── Redis: queue + batch store ──────────────────────────────────────────────
  # noeviction is deliberate: the queue holds uploaded resume bytes, and an
  # eviction policy would silently drop pending work under memory pressure.
  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - "1gb"
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # ── API: accepts uploads, never parses on the request path ──────────────────
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    environment: &app-env
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-deepseek/deepseek-v4-flash}
      - OPENROUTER_OCR_MODEL=${OPENROUTER_OCR_MODEL:-openai/gpt-4o-mini}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      - API_KEY=${API_KEY:-changeme}
      - MAX_FILE_SIZE=${MAX_FILE_SIZE:-10485760}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - QUEUE_NAME=${QUEUE_NAME:-resume_parse}
      - QUEUE_MAX_FILES=${QUEUE_MAX_FILES:-100}
      - WORKER_CONCURRENCY=${WORKER_CONCURRENCY:-8}
      - JOB_TIMEOUT=${JOB_TIMEOUT:-300}
      - JOB_MAX_TRIES=${JOB_MAX_TRIES:-3}
      - JOB_TTL=${JOB_TTL:-86400}
      - JOB_STALE_SECONDS=${JOB_STALE_SECONDS:-1800}
      - JOB_CALLBACK_ALLOWED_HOSTS=${JOB_CALLBACK_ALLOWED_HOSTS:-}
      - SF_CLIENT_ID=${SF_CLIENT_ID:-}
      - SF_CLIENT_SECRET=${SF_CLIENT_SECRET:-}
      - SF_USERNAME=${SF_USERNAME:-}
      - SF_PASSWORD=${SF_PASSWORD:-}
      - SF_SECURITY_TOKEN=${SF_SECURITY_TOKEN:-}
      - SF_LOGIN_URL=${SF_LOGIN_URL:-https://login.salesforce.com}
      - SF_API_VERSION=${SF_API_VERSION:-59.0}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health')"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 5s

  # ── Worker: drains the queue. Scale with `docker compose up -d --scale worker=3`
  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["arq", "app.worker.WorkerSettings"]
    environment: *app-env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis-data:
